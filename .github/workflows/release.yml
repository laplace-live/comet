name: Release

# Changesets flow (laplace-persona / laplace-jupiter pattern): while changesets
# exist on master, keep a "chore: version packages" PR open (version bumps +
# CHANGELOG.md files). Once it merges, `changeset publish` publishes the bumped
# npm packages and tags each bumped package <name>@<version>, and the action
# pushes the tags. The app's, laplace-comet@<version>, fires build.yml, which
# signs, uploads to R2 and publishes the GitHub Release with the CHANGELOG
# notes and the installers attached: releases are immutable once published, so
# it can't be created first and filled in later.
#
# A GitHub App token (not the default GITHUB_TOKEN) authenticates the action:
# events caused by GITHUB_TOKEN don't start other workflows, so the tag would
# never build, and checks on the version PR would wait for manual approval.

on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  # npm trusted publishing (OIDC) and its provenance attestations
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so each CHANGELOG line can link the commit that added its changeset
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Requires the laplace-release-bot GitHub App installed on this repo with
      # Contents and Pull requests read & write, its Client ID and private key
      # stored in the `RELEASE_APP_CLIENT_ID` and `RELEASE_APP_PRIVATE_KEY` org
      # secrets.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create version PR or publish release
        uses: changesets/action@v2
        with:
          version-script: pnpm exec changeset version
          # `changeset publish` publishes the non-private packages
          # (@laplace.live/bilibili-qr) whose version isn't on npm yet, and
          # creates every <name>@<version> tag that doesn't exist yet, the
          # private app's included (privatePackages.tag); the action pushes them
          # through the API. pnpm publishes via npm's trusted publishing (OIDC), so no
          # npm token is set anywhere. A failed publish pushes no tag at all.
          publish-script: pnpm exec changeset publish
          commit-message: "chore: version packages [skip ci]"
          pr-title: "chore: version packages"
          # Releases are immutable once published, so nothing can be attached
          # afterwards: the action only pushes the tags, and build.yml, which
          # the app's tag fires, publishes the release with its installers.
          create-github-releases: false
          # Must be passed as an input: v2 doesn't read the `GITHUB_TOKEN` env var.
          github-token: ${{ steps.app-token.outputs.token }}
