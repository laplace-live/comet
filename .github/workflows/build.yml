name: Build and Release

on:
  push:
    branches: [main, master]
    # laplace-comet@<version>, pushed by release.yml (changesets) with the
    # release bot's token so this trigger fires (GITHUB_TOKEN pushes start no
    # workflows). Releases up to 1.4.0 were tagged v<version>.
    tags:
      - "laplace-comet@*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  # Cloudflare R2 bucket configuration - update these to match your bucket
  R2_BUCKET: downloads
  # R2 key prefix for releases (e.g., "comet" or "releases/comet")
  R2_PREFIX: comet

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: darwin

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      # What `changeset publish` builds for npm: a package that fails to build
      # would block the release, the app's tag included.
      - name: Build workspace packages
        run: pnpm --filter "./packages/**" build

      - name: Import Apple Certificate
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/laplace-comet@')
        # if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create the keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Add keychain to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Sign with the identity the certificate carries, so the team follows APPLE_CERTIFICATE alone
          APPLE_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)
          if [ -z "$APPLE_IDENTITY" ]; then
            echo "::error::APPLE_CERTIFICATE holds no valid Developer ID Application identity"
            exit 1
          fi
          # Masked in logs, as it was when it came from a secret
          echo "::add-mask::$APPLE_IDENTITY"
          echo "APPLE_IDENTITY=$APPLE_IDENTITY" >> "$GITHUB_ENV"

          # Clean up
          rm $RUNNER_TEMP/certificate.p12

      - name: Prepare Apple API Key
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/laplace-comet@')
        # if: matrix.os == 'macos-latest'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY" > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Debug Build Environment
        if: matrix.os == 'macos-latest'
        run: npx tsx scripts/debug-build-env.ts
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build application (Release)
        if: startsWith(github.ref, 'refs/tags/laplace-comet@')
        run: pnpm make
        env:
          NODE_ENV: production
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build application (Development)
        if: ${{ !startsWith(github.ref, 'refs/tags/laplace-comet@') }}
        run: pnpm make
        env:
          NODE_ENV: development

      - name: Sign Windows binaries with Trusted Signing
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/laplace-comet@')
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: out/make/squirrel.windows/x64
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/laplace-comet@')
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/laplace-comet@}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload Windows Release to R2
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/laplace-comet@')
        env:
          # R2 bucket-scoped tokens are rejected by the REST route wrangler
          # uses, but work on the S3-compatible API, so upload via aws CLI.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 doesn't support the CRC32 streaming checksums newer aws CLIs
          # send by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          # Upload RELEASES manifest with no-cache header (checked frequently for updates)
          aws s3 cp out/make/squirrel.windows/x64/RELEASES "s3://$R2_BUCKET/$R2_PREFIX/win32/x64/RELEASES" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "no-cache, no-store, must-revalidate"

          # Upload binaries with standard cache (filenames include version)
          aws s3 cp out/make/squirrel.windows/x64/ "s3://$R2_BUCKET/$R2_PREFIX/win32/x64/" \
            --endpoint-url "$R2_ENDPOINT" \
            --recursive --exclude "*" --include "*.exe" --include "*.nupkg" \
            --cache-control "public, max-age=31536000, immutable"

          # Upload to versioned path for archival (can be cached indefinitely)
          aws s3 cp out/make/squirrel.windows/x64/ "s3://$R2_BUCKET/$R2_PREFIX/win32/x64/${{ steps.version.outputs.VERSION }}/" \
            --endpoint-url "$R2_ENDPOINT" \
            --recursive --exclude "*" --include "*.exe" --include "*.nupkg" --include "RELEASES" \
            --cache-control "public, max-age=31536000, immutable"
        shell: bash

      - name: Upload macOS Release to R2
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/laplace-comet@')
        env:
          # R2 bucket-scoped tokens are rejected by the REST route wrangler
          # uses, but work on the S3-compatible API, so upload via aws CLI.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 doesn't support the CRC32 streaming checksums newer aws CLIs
          # send by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          for arch_dir in out/make/zip/darwin/*/; do
            arch=$(basename "$arch_dir")

            # Upload RELEASES.json manifest with no-cache header (checked frequently for updates)
            aws s3 cp "${arch_dir}RELEASES.json" "s3://$R2_BUCKET/$R2_PREFIX/darwin/${arch}/RELEASES.json" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "no-cache, no-store, must-revalidate"

            # Upload zip with standard cache (filename includes version)
            aws s3 cp "$arch_dir" "s3://$R2_BUCKET/$R2_PREFIX/darwin/${arch}/" \
              --endpoint-url "$R2_ENDPOINT" \
              --recursive --exclude "*" --include "*.zip" \
              --cache-control "public, max-age=31536000, immutable"

            # Upload to versioned path for archival (can be cached indefinitely)
            aws s3 cp "$arch_dir" "s3://$R2_BUCKET/$R2_PREFIX/darwin/${arch}/${{ steps.version.outputs.VERSION }}/" \
              --endpoint-url "$R2_ENDPOINT" \
              --recursive \
              --cache-control "public, max-age=31536000, immutable"
          done
        shell: bash

      # Release files for the github-release job, which publishes the release
      # with all of them attached at once: releases are immutable once published.
      - name: Upload release files (Windows)
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/laplace-comet@')
        uses: actions/upload-artifact@v7
        with:
          name: release-win
          if-no-files-found: error
          path: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES

      - name: Upload release files (macOS)
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/laplace-comet@')
        uses: actions/upload-artifact@v7
        with:
          name: release-darwin
          if-no-files-found: error
          path: |
            out/make/zip/darwin/**/*.zip
            out/make/zip/darwin/**/RELEASES.json

      - name: Upload artifacts for debugging (Windows)
        if: matrix.os == 'windows-latest' && !startsWith(github.ref, 'refs/tags/laplace-comet@')
        uses: actions/upload-artifact@v7
        with:
          name: build-win-${{ github.sha }}
          path: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
          retention-days: 7

      - name: Upload artifacts for debugging (macOS)
        if: matrix.os == 'macos-latest' && !startsWith(github.ref, 'refs/tags/laplace-comet@')
        uses: actions/upload-artifact@v7
        with:
          name: build-darwin-${{ github.sha }}
          path: out/make/zip/darwin/**/*.zip
          retention-days: 7

  # The only job with write access: builds (which run PR code) stay read-only.
  # Releases are immutable once published, so this publishes the release with
  # every installer attached at once.
  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/laplace-comet@')
    runs-on: ubuntu-latest
    # One publisher per tag: a rerun queues behind a running one instead of racing over the same draft.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish the release with its installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sh .github/scripts/changelog-section.sh CHANGELOG.md "${TAG#laplace-comet@}" > notes.md
          # An immutable release can't take an installer later, so refuse to publish without all of them.
          for pattern in '*.exe' '*.nupkg' 'RELEASES' '*.zip' 'RELEASES.json'; do
            if [ -z "$(find dist -type f -name "$pattern")" ]; then
              echo "::error::Missing $pattern"
              exit 1
            fi
          done
          # Files sit in per-arch folders and have spaces in their names.
          find dist -type f -print0 | xargs -0 sh .github/scripts/publish-release.sh "$TAG" notes.md
