# The app is the root package; libraries it shares live in packages/. pnpm always includes the
# root, but changesets only versions it when it is listed here too.
packages:
  - .
  - packages/*
# The root is the app, so `pnpm add` there means it: no `-w` needed, as before the workspace.
ignoreWorkspaceRootCheck: true

nodeLinker: hoisted
blockExoticSubdeps: false
allowBuilds:
  electron-winstaller: true
  protobufjs: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - electron@44.9.0
